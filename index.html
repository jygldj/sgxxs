<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="description" content="三国续-数字卜易传 - 古典章回体小说连载，数字六爻演义">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23c0392b'>📜</text></svg>">
    <title>三国续-数字卜易传</title>
    <link rel="stylesheet" href="style.css">
    <!-- 百度统计代码（异步加载，不阻塞页面渲染） -->
    <script async src="https://hm.baidu.com/hm.js?35b5524e050763995511f80570ae121c"></script>
    <link rel="stylesheet" href="cover.css">
</head>
<body>
    <div class="book-cover" id="bookCover">
        <!-- 翻书背面（动画时遮住翻转背面） -->
        <div class="book-back"></div>
        <div class="front-cover">
            <!-- 封面主视觉：竖版小说封面图 -->
            <div class="cover-art">
                <img src="images/cover.png" alt="三国续·数字卜易传 封面" />
            </div>

            <!-- 展卷阅读按钮 -->
            <button class="open-book" onclick="navigateWithAnimation()">展卷阅读</button>

            <!-- 兄弟站点互链 -->
            <div class="links-section">
                <div class="links-title">⎯⎯ 兄弟站点 ⎯⎯</div>
                <div class="friend-links-grid">
                    <a href="https://jygldj.github.io/w/index1.html" target="_blank">道玄文集</a>
                    <a href="https://sxxz.pages.dev/index.html" target="_blank">三省轩主文集</a>
                    <a href="https://dxzsby.pages.dev/index.html" target="_blank">增删卜易</a>
                    <a href="https://sgxxs.pages.dev/" target="_blank" class="self-link">本站 · 三国续</a>
                    <a href="https://mp.weixin.qq.com/mp/appmsgalbum?__biz=Mzk0ODc1MzcxMg==&action=getalbum&album_id=4070727578921992197#wechat_redirect" target="_blank">道玄公众号</a>
                    <a href="https://www.gushiwen.org/" target="_blank">古诗文网</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 离线缓存（Service Worker）：成功打开一次后，网络卡顿/断网也能进入文集
        // 注册延后到 load，避免预缓存下载抢占首屏带宽（移动端首次打开更快）
        window.addEventListener('load', function () {
            if ('serviceWorker' in navigator && location.protocol !== 'file:') {
                navigator.serviceWorker.register('sw.js').catch(function(){});
            }
        });

        // 翻页动画导航
        function navigateWithAnimation() {
            document.getElementById('bookCover').classList.add('opened');
            setTimeout(() => {
                window.location.href = "index1.html";
            }, 800);
        }
    </script>
</body>
</html>
